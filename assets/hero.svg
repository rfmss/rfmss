<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Rafa Mass — escrita, língua e software</title>
  <desc id="desc">Banner no estilo RafaMass Blueprint: palco técnico escuro, folha de papel, linhas cyan, tinta preta e um único sinal vermelhão.</desc>
  <defs>
    <pattern id="stage-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#86c7df" stroke-opacity=".07"/>
    </pattern>
    <pattern id="paper-dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161817" fill-opacity=".065"/>
    </pattern>
    <pattern id="blueprint-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#36a7d2" stroke-opacity=".22"/>
      <path d="M16 0V32M0 16H32" fill="none" stroke="#36a7d2" stroke-opacity=".09"/>
    </pattern>
    <linearGradient id="paper-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset=".36" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="20" fill="#0f1113"/>
  <rect width="1200" height="400" rx="20" fill="url(#stage-grid)"/>
  <rect x="14" y="14" width="1172" height="372" rx="12" fill="none" stroke="#86c7df" stroke-opacity=".18"/>

  <g font-family="Courier New, Courier, monospace" font-weight="700" letter-spacing="2.2">
    <text x="44" y="42" fill="#86c7df" font-size="10">REGISTRO PÚBLICO 026 // PERFIL 001</text>
    <text x="1156" y="42" fill="#f3eee4" fill-opacity=".58" font-size="10" text-anchor="end">RF MSS · BRASIL · OFICINA ABERTA</text>
  </g>

  <rect x="58" y="78" width="826" height="266" rx="19" fill="#161817" opacity=".34" transform="translate(8 10)"/>
  <rect x="58" y="78" width="826" height="266" rx="19" fill="#f3eee4" stroke="#36a7d2" stroke-width="2"/>
  <rect x="66" y="86" width="810" height="250" rx="12" fill="none" stroke="#36a7d2" stroke-opacity=".34"/>
  <rect x="58" y="78" width="826" height="266" rx="19" fill="url(#paper-dots)"/>
  <rect x="58" y="78" width="826" height="266" rx="19" fill="url(#paper-sheen)"/>

  <g transform="translate(96 112)">
    <text x="0" y="19" fill="#087da9" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700" letter-spacing="2.4">RAFAEL MASSENA // ESCRITOR × DESENVOLVEDOR</text>
    <line x1="0" y1="38" x2="700" y2="38" stroke="#161817" stroke-width="4"/>

    <text x="0" y="122" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="-6">RAFA</text>
    <text x="205" y="122" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="-6">MASS</text>
    <rect x="177" y="58" width="13" height="70" fill="#ff5a19"/>

    <text x="3" y="163" fill="#161817" fill-opacity=".72" font-family="Georgia, Times New Roman, serif" font-size="22" font-style="italic">escrita · língua portuguesa · educação · software</text>
    <text x="3" y="203" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700">ferramentas locais, gratuitas e feitas para durar.</text>
    <text x="3" y="220" fill="#161817" fill-opacity=".62" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700" letter-spacing="1.4">PRIVACIDADE É PADRÃO // A FERRAMENTA NÃO É A AUTORA</text>
  </g>

  <g transform="translate(916 78)">
    <rect width="226" height="266" fill="#d8f0f8" stroke="#161817" stroke-width="2"/>
    <rect width="226" height="266" fill="url(#blueprint-grid)"/>
    <path d="M14 14H54M14 14V54M212 212V252M172 252H212" fill="none" stroke="#ff5a19" stroke-width="3"/>

    <g fill="none" stroke="#161817" stroke-width="2">
      <circle cx="113" cy="121" r="64"/>
      <circle cx="113" cy="121" r="48" stroke-dasharray="4 6"/>
      <path d="M49 121H177M113 57V185" stroke="#36a7d2"/>
      <path d="M77 85l72 72M149 85l-72 72" stroke="#36a7d2" stroke-opacity=".7"/>
    </g>

    <rect x="83" y="91" width="60" height="60" rx="5" fill="#ff5a19" stroke="#161817" stroke-width="2" transform="rotate(4 113 121)"/>
    <text x="113" y="132" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" text-anchor="middle">RF</text>

    <g fill="#161817" font-family="Courier New, Courier, monospace" font-size="9" font-weight="700" letter-spacing="1.2">
      <text x="15" y="238">BLUEPRINT SYSTEM</text>
      <text x="15" y="253">COORD. 22°54′S // 43°12′W</text>
    </g>
  </g>

  <g fill="#f3eee4" fill-opacity=".55" font-family="Courier New, Courier, monospace" font-size="9" font-weight="700" letter-spacing="1.4">
    <text x="44" y="376">ESTRUTURA ANTES DO ORNAMENTO</text>
    <text x="1156" y="376" text-anchor="end">RAFA.PRO.BR // RFMSS</text>
  </g>
</svg>
