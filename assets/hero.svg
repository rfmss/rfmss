<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Rafa Mass — software local-first para escrita e português brasileiro</title>
  <desc id="desc">Banner RafaMass Blueprint com palco técnico, papel, linhas cyan e registro do Escrevaral.</desc>
  <defs>
    <pattern id="stage-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#86c7df" stroke-opacity=".07"/>
    </pattern>
    <pattern id="paper-dots" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#161817" fill-opacity=".065"/>
    </pattern>
    <pattern id="blue-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#36a7d2" stroke-opacity=".24"/>
      <path d="M14 0V28M0 14H28" fill="none" stroke="#36a7d2" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="paper-sheen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff" stop-opacity=".42"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" rx="18" fill="#0f1113"/>
  <rect width="1200" height="340" rx="18" fill="url(#stage-grid)"/>
  <rect x="13" y="13" width="1174" height="314" rx="11" fill="none" stroke="#86c7df" stroke-opacity=".18"/>

  <g font-family="Courier New, Courier, monospace" font-weight="700" letter-spacing="2.1">
    <text x="38" y="38" fill="#86c7df" font-size="10">PUBLIC ENGINEERING PROFILE // RECORD 001</text>
    <text x="1162" y="38" fill="#f3eee4" fill-opacity=".6" font-size="10" text-anchor="end">RFMSS · RAFA.PRO.BR · BRASIL</text>
  </g>

  <rect x="50" y="68" width="814" height="220" rx="17" fill="#000" opacity=".34" transform="translate(7 9)"/>
  <rect x="50" y="68" width="814" height="220" rx="17" fill="#f3eee4" stroke="#36a7d2" stroke-width="2"/>
  <rect x="58" y="76" width="798" height="204" rx="10" fill="none" stroke="#36a7d2" stroke-opacity=".34"/>
  <rect x="50" y="68" width="814" height="220" rx="17" fill="url(#paper-dots)"/>
  <rect x="50" y="68" width="814" height="220" rx="17" fill="url(#paper-sheen)"/>

  <g transform="translate(86 95)">
    <text x="0" y="16" fill="#087da9" font-family="Courier New, Courier, monospace" font-size="10" font-weight="700" letter-spacing="2.2">RAFA MASS // RFMSS // WRITER × DEVELOPER</text>
    <line x1="0" y1="31" x2="710" y2="31" stroke="#161817" stroke-width="4"/>

    <text x="0" y="100" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" letter-spacing="-5.5">RAFA</text>
    <rect x="173" y="48" width="12" height="62" fill="#ff5a19"/>
    <text x="199" y="100" fill="#161817" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="900" letter-spacing="-5.5">MASS</text>

    <text x="2" y="137" fill="#161817" font-family="Georgia, Times New Roman, serif" font-size="21" font-style="italic">software local-first para escrita e português brasileiro</text>
    <text x="2" y="172" fill="#161817" font-family="Courier New, Courier, monospace" font-size="11" font-weight="700" letter-spacing="1.25">VANILLA JAVASCRIPT · PWA · ENGINES LINGUÍSTICAS · OFFLINE</text>
  </g>

  <g transform="translate(898 68)">
    <rect width="252" height="220" fill="#d8f0f8" stroke="#161817" stroke-width="2"/>
    <rect width="252" height="220" fill="url(#blue-grid)"/>
    <path d="M12 12H49M12 12V49M240 171V208M203 208H240" fill="none" stroke="#ff5a19" stroke-width="3"/>

    <g font-family="Courier New, Courier, monospace" font-weight="700" letter-spacing="1.4">
      <text x="18" y="29" fill="#087da9" font-size="9">CURRENT SYSTEM</text>
      <text x="18" y="53" fill="#161817" font-size="13">ESCREVARAL / ARGILA 1.0</text>
    </g>

    <g transform="translate(18 72)">
      <rect width="63" height="63" rx="5" fill="#ff5a19" stroke="#161817" stroke-width="2" transform="rotate(-2 31.5 31.5)"/>
      <text x="31.5" y="43" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" text-anchor="middle">E</text>
    </g>

    <g fill="#161817" font-family="Courier New, Courier, monospace" font-size="9.5" font-weight="700" letter-spacing="1.1">
      <text x="101" y="86">BROWSER-NATIVE</text>
      <text x="101" y="105">NO APP SERVER</text>
      <text x="101" y="124">MANUSCRIPTS LOCAL</text>
      <text x="101" y="143">RELEASE GATES</text>
    </g>

    <line x1="18" y1="164" x2="234" y2="164" stroke="#161817" stroke-width="2"/>
    <g fill="#161817" font-family="Courier New, Courier, monospace" font-size="8.5" font-weight="700" letter-spacing="1">
      <text x="18" y="184">ARCHITECTURE → CODE → AUDIT</text>
      <text x="18" y="201">EVIDENCE BEFORE CLAIMS</text>
    </g>
  </g>

  <g fill="#f3eee4" fill-opacity=".55" font-family="Courier New, Courier, monospace" font-size="9" font-weight="700" letter-spacing="1.35">
    <text x="38" y="318">LOCAL EXECUTION // EXPLICIT BOUNDARIES // TESTABLE SYSTEMS</text>
    <text x="1162" y="318" text-anchor="end">RAFA MASS // TECHNICAL SIGNATURE</text>
