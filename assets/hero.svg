<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Rafael Massena — software para quem escreve</title>
  <desc id="desc">Banner roxo escuro com linhas editoriais, o nome Rafael Massena, a frase software para quem escreve e o facão do Escrevaral.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#110E18"/>
      <stop offset="0.55" stop-color="#1B1428"/>
      <stop offset="1" stop-color="#24133B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#9A83FF"/>
      <stop offset="1" stop-color="#D7CBFF"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#B39DFF" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="55"/></filter>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1045" cy="78" r="145" fill="#7448E8" opacity=".18" filter="url(#blur)"/>
  <circle cx="108" cy="330" r="100" fill="#9A83FF" opacity=".12" filter="url(#blur)"/>

  <g fill="none" stroke="#BDAEFF" stroke-opacity=".35">
    <path d="M890 50c64 19 103 63 116 132s51 108 144 117"/>
    <path d="M930 35c44 41 63 84 58 129s9 85 44 119 82 48 142 41"/>
    <path d="M986 30c18 45 17 83-2 114s-22 65-8 103 46 68 96 91"/>
  </g>

  <rect x="74" y="60" width="66" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="74" y="135" fill="#F8F5FF" font-family="ui-serif, Georgia, serif" font-size="62" font-weight="700" letter-spacing="-1">Rafael Massena</text>
  <text x="77" y="184" fill="#C8B9EF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" letter-spacing="3">ESCRITOR  ×  DESENVOLVEDOR</text>
  <line x1="75" y1="224" x2="575" y2="224" stroke="#8E75E8" stroke-opacity=".55"/>
  <text x="75" y="276" fill="#EEE9FF" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="500">software para quem escreve.</text>
  <text x="77" y="310" fill="#AFA3C8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">privado por princípio · simples por escolha · aberto para todos</text>

  <g transform="translate(1062 194) rotate(-42)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-12-72C20-52 39-17 42 31L33 73H5l5-39C11 3 1-20-22-38L-37-49Z" fill="url(#accent)" stroke="#E6DEFF" stroke-width="2.5"/>
    <path d="M-22-38C1-20 11 3 10 34L5 73" fill="none" stroke="#6D54C8" stroke-width="2" opacity=".8"/>
    <path d="M-2 73h42v13H-2z" fill="#9A83FF" stroke="#E6DEFF" stroke-width="2.5"/>
    <path d="M5 86h28v55c0 9-6 16-14 16S5 150 5 141Z" fill="#17121F" stroke="#CDBFFF" stroke-width="2.5"/>
    <path d="M6 101h26M6 113h26M6 125h26M6 137h26" fill="none" stroke="#8E75E8" stroke-width="3"/>
    <circle cx="19" cy="145" r="3" fill="#CDBFFF"/>
